name: Compilar APK

# Se ejecuta a mano (Actions → Compilar APK → Run workflow)
# o automáticamente al crear una etiqueta que empiece con "v" (por ejemplo v1.0.0),
# en cuyo caso además publica el APK como Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  KS: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar los archivos web
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Crear el proyecto Android con Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          npx cap init "CreatorKit" "com.b3njamingc.creatorkit" --web-dir www
          npx cap add android

      - name: Generar íconos de la app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0f1220' --iconBackgroundColorDark '#0f1220'

      - name: Número de versión
        run: |
          VN="1.0.${{ github.run_number }}"
          case "$GITHUB_REF" in refs/tags/v*) VN="${GITHUB_REF_NAME#v}";; esac
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle
          npx cap sync android

      # Sin claves de firma: APK de prueba (se instala igual, pero no se puede actualizar encima de otra versión)
      - name: Compilar APK (sin firma propia)
        if: ${{ env.KS == '' }}
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CreatorKit.apk

      # Con claves de firma (secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS): APK firmado y actualizable
      - name: Compilar APK firmado
        if: ${{ env.KS != '' }}
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../CreatorKit.apk "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CreatorKit-apk
          path: CreatorKit.apk

      # Publica (o actualiza) la Release con el APK. Con una etiqueta "v..." usa esa etiqueta;
      # en una ejecución manual crea una nueva (v1.0.<número de ejecución>).
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: CreatorKit ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          body: |
            App de Android de CreatorKit. Descarga **CreatorKit.apk**, ábrelo en el celular y permite "instalar apps desconocidas" si te lo pide.
            Incluye generador de títulos, analizador, editor de miniaturas, calendario, checklist, ideas y cuentas con Pro.
          files: CreatorKit.apk
          make_latest: true
