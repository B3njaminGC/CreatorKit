name: Mantener Supabase activo

# Supabase (plan gratis) pausa el proyecto tras 1 semana sin actividad.
# Esta tarea le hace una consulta cada 3 días para que no se pause.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          URL="https://waxblpcojiqamlxgspdd.supabase.co/rest/v1/"
          KEY="sb_publishable_ZGY9cpOsLZ1S0Hf5Yek-zw_Z_FDVI6K"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" -H "apikey: $KEY")
            echo "Respuesta: $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          exit 1
